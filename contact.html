<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — The Sweet Spot Bakery</title>
<meta name="description" content="Get in touch with The Sweet Spot Bakery via phone, WhatsApp or email.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="nav-mount"></div>

<section>
  <div class="container">
    <div class="section-head reveal"><span class="eyebrow">Contact</span><h2>We'd love to hear from you</h2><p>Send us a message and we'll get back to you the same day.</p></div>

    <div class="contact-grid">
      <form id="contact-form" class="reveal" novalidate>
        <div class="form-group"><label for="name">Your Name</label><input id="name" name="name" type="text" required></div>
        <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
        <div class="form-group"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
        <div class="form-group"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>

      <div class="contact-info reveal">
        <h3>Get in touch</h3>
        <p>📞 <strong>+27 73 884 5264</strong></p>
        <p>✉️ <strong>jjbeukes@thesweetspot.co.za</strong></p>
        <p>📍 <strong>123 Bakery Lane, Klawer</strong></p>
        <div style="margin-top:1rem"><a class="btn btn-primary" data-wa="Hi! I have a question.">Chat on WhatsApp</a></div>
        <div class="map-embed">🗺️ Google Maps embed placeholder</div>
      </div>
    </div>
  </div>
</section>

<div id="footer-mount"></div>
<script src="partials.js"></script>
<script src="script.js"></script>
</body>
</html>
